id: ai-developer-ui
name: AI Developer Workflow (UI)
version: 1
description: |
  7-step AI developer pipeline for amakaflow-ui (TypeScript/React).
  Uses Kimi K2.5 as the developer model.
  - Ticket Picker: Picks next Linear ticket scoped to amakaflow-ui
  - Developer: Implements code + commits to branch (NO PR)
  - Developer: Runs tests on the branch (retries develop on failure)
  - Auditor: Reviews code on branch for security + best practices
  - Developer: Fixes audit issues + creates PR
  - Closer: Merges PR
  - Closer: Verifies merge + cleans up work directories

notifications:
  url: http://127.0.0.1:9876

context:
  repo: Amakaflow/amakaflow-ui
  linear_project: AMA
  linear_team: MyAmaka

polling:
  model: moonshot/kimi-k2.5
  timeoutSeconds: 300

cron:
  timeout_seconds: 0

agents:
  - id: picker
    name: Ticket Picker
    role: analysis
    model: moonshot/kimi-k2.5
    description: Picks next ready Linear ticket scoped to amakaflow-ui
    workspace:
      baseDir: agents/picker
      files:
        AGENTS.md: agents/picker/AGENTS.md

  - id: developer
    name: Developer
    role: coding
    model: moonshot/kimi-k2.5
    description: Implements ticket code with Kimi K2.5
    workspace:
      baseDir: agents/developer
      files:
        AGENTS.md: agents/developer/AGENTS.md

  - id: auditor
    name: Auditor
    role: analysis
    model: moonshot/kimi-k2.5
    description: Reviews code on branch for security + performance
    workspace:
      baseDir: agents/auditor
      files:
        AGENTS.md: agents/auditor/AGENTS.md

  - id: closer
    name: Closer
    role: analysis
    model: moonshot/kimi-k2.5
    description: Merges PR, verifies, cleans up
    workspace:
      baseDir: agents/closer
      files:
        AGENTS.md: agents/closer/AGENTS.md

steps:
  - id: pick_ticket
    agent: picker
    input: |
      TASK: "{{task}}"

      ⚠️ CRITICAL RULE — READ THIS FIRST:
      Extract any ticket ID (like AMA-607, AMA-123, etc.) from the TASK above.
      If a ticket ID is present, you MUST look up THAT EXACT ticket in Linear
      and return its details. Do NOT search the backlog. Do NOT pick a different
      ticket. Just fetch the one specified and return it.
      HOWEVER — before returning it, check for an existing open PR (see step 0 below).

      Step 0 — DUPLICATE WORK CHECK (run before selecting ANY ticket):
      Check for existing open PRs in the repo:
        gh pr list --repo {{repo}} --state open --json title,number,headRefName
      For each candidate ticket ID, check if any open PR's title or branch name
      contains that ticket ID (e.g., "AMA-607" appears in the PR title or branch).
      If an open PR already exists for a ticket:
        - If the TASK specified that exact ticket ID, reply:
          STATUS: duplicate
          TICKET_ID: <the ticket ID>
          EXISTING_PR: <the PR number and URL>
          REASON: An open PR already exists for this ticket
        - If picking from the backlog, skip that ticket and pick the next one.

      ONLY if the TASK contains NO ticket ID, then pick from the backlog:
      1. Query Linear for issues in the {{linear_team}} team where:
         - Status is "Todo", "In Progress", or "Ready"
         - Not blocked by unfinished dependencies
         - The ticket is for the amakaflow-ui frontend (TypeScript/React/Next.js)
           Look for: .tsx, .ts files, React components, Next.js pages, UI features,
           frontend routing, CSS/styling, or explicit mention of amakaflow-ui in the description.
           SKIP tickets for: mapper-api (Python/FastAPI), workout-ingestor-api, chat-api,
           amakaflow-automation (Maestro), or amakaflow-android-app (Kotlin/Android).
      2. SKIP these ticket types (they are not coding tasks):
         - Tickets with "SPIKE" in the title (research/planning tasks)
         - Tickets with "SPIKE" label
         - Tickets that are purely documentation or research with no code changes
      3. Sort by priority (Urgent > High > Medium > Low > No priority)
      4. Pick the highest-priority unblocked CODING ticket for amakaflow-ui that has NO existing open PR
      5. Get full ticket details: title, description, acceptance criteria
      6. If no tickets are ready (or all have existing PRs), reply with STATUS: no_work

      Reply with EXACTLY this format:
      STATUS: done
      TICKET_ID: <the ticket ID, e.g. AMA-607>
      TITLE: <ticket title>
      DESCRIPTION: <full description from Linear>
      ACCEPTANCE_CRITERIA: |
        - Criterion 1
        - Criterion 2
    expects: "STATUS: done"
    max_retries: 1
    on_fail:
      escalate_to: human

  - id: develop
    agent: developer
    timeoutSeconds: 600
    input: |
      🚨 CRITICAL: OUTPUT FORMAT REQUIREMENTS (READ THIS FIRST) 🚨

      You MUST respond with EXACTLY these four keys — NO substitutions, NO variations:

      STATUS: done
      BRANCH_NAME: feature/AMA-607-short-name
      CHANGED_FILES: file1.ts, file2.ts
      REPO_NAME: Amakaflow/amakaflow-ui

      ❌ WRONG key names that will BREAK the system:
      - CHANGES: (wrong — must be CHANGED_FILES)
      - FILES: (wrong — must be CHANGED_FILES)
      - BRANCH: (wrong — must be BRANCH_NAME)
      - REPO: (wrong — must be REPO_NAME)
      - PR_NUMBER: (wrong — NO PR in this step)
      - PR_URL: (wrong — NO PR in this step)

      ✅ CORRECT example output:
      STATUS: done
      BRANCH_NAME: feature/AMA-607-element-highlight
      CHANGED_FILES: src/components/OutlinePulse.tsx, src/types/highlight.ts, tests/OutlinePulse.test.tsx
      REPO_NAME: Amakaflow/amakaflow-ui

      ALL FOUR KEYS ARE MANDATORY. Missing any key will cause pipeline failure.
      🚫 Do NOT create a Pull Request. Just commit and push the branch.

      ═══════════════════════════════════════════════════════════════════════

      Implement {{ticket_id}} ({{title}}).

      REPO: Amakaflow/amakaflow-ui
      TICKET: {{ticket_id}}
      TITLE: {{title}}
      DESCRIPTION: {{description}}
      ACCEPTANCE_CRITERIA:
      {{acceptance_criteria}}

      Instructions:
      1. Clone the repo fresh (clean slate for retries):
         rm -rf /tmp/{{ticket_id}}-work
         git clone https://github.com/Amakaflow/amakaflow-ui.git /tmp/{{ticket_id}}-work
         cd /tmp/{{ticket_id}}-work && git checkout develop && git pull origin develop
      2. Create feature branch FROM latest develop (use -B to force-create even if it exists):
         git checkout -B feature/{{ticket_id}}-short-name
      3. Read existing code to understand patterns and style
      4. Implement the changes per the acceptance criteria
      5. Run tests to verify your code works:
         npm test || npx vitest run || npx jest
         If tests fail, fix the code until they pass
      6. Commit all changes with a clear message referencing {{ticket_id}}
      7. MANDATORY VALIDATION before pushing:
         git rev-list --count develop..HEAD
         If the count is 0, you have NO commits. You MUST have written and committed code.
         If the ticket appears already implemented, call step fail — do NOT push an empty branch.
      8. Rebase on latest develop before pushing (avoids conflict PRs):
         git fetch origin develop
         git rebase origin/develop
         If rebase fails: git rebase --abort, reply STATUS: escalate with conflicted files listed
      9. Push the branch (force-push to overwrite any stale remote branch from a cancelled run):
         git push --force-with-lease -u origin <branch-name>
      10. 🚫 Do NOT create a Pull Request — just push the branch

      ═══════════════════════════════════════════════════════════════════════

      🚨 REMINDER: MANDATORY OUTPUT FORMAT (USE EXACT KEY NAMES) 🚨

      Your response MUST contain EXACTLY these four keys:

      STATUS: done
      BRANCH_NAME: feature/{{ticket_id}}-short-name
      CHANGED_FILES: file1.ts, file2.ts, file3.ts
      REPO_NAME: Amakaflow/amakaflow-ui

      - STATUS must be "done"
      - BRANCH_NAME must be the exact git branch name you pushed
      - CHANGED_FILES must list all modified files (comma-separated)
      - REPO_NAME must be Amakaflow/amakaflow-ui

      DO NOT use any other key names. DO NOT add extra keys. DO NOT omit any keys.
      DO NOT create a Pull Request.
    expects: "STATUS: done"
    max_retries: 4
    on_fail:
      escalate_to: human

  - id: run_tests
    agent: developer
    timeoutSeconds: 300
    input: |
      🚨 CRITICAL: OUTPUT FORMAT REQUIREMENTS (READ THIS FIRST) 🚨

      You MUST respond with EXACTLY these three keys:

      STATUS: done
      TESTS_PASSED: true
      TEST_OUTPUT: <summary of test results>

      ═══════════════════════════════════════════════════════════════════════

      Run the test suite for {{ticket_id}} on branch {{branch_name}}.

      BRANCH: {{branch_name}}
      REPO: Amakaflow/amakaflow-ui
      REPO_FALLBACK: {{repo}}
      TICKET: {{ticket_id}}

      ⚠️ FALLBACK: If BRANCH contains "[missing:" values, discover it:
        git ls-remote --heads https://github.com/Amakaflow/amakaflow-ui.git "refs/heads/feature/{{ticket_id}}*"
        Use the first matching branch name.

      Task:
      1. Check out the branch:
         cd /tmp/{{ticket_id}}-work && git checkout {{branch_name}} && git pull origin {{branch_name}}
         OR if directory doesn't exist:
         git clone https://github.com/Amakaflow/amakaflow-ui.git /tmp/{{ticket_id}}-work
         cd /tmp/{{ticket_id}}-work && git checkout {{branch_name}}

      2. Install dependencies if needed:
         npm install (or npm ci if lock file exists)

      3. Run tests:
         npm test || npx vitest run || npx jest

      4. Capture the full test output (pass/fail counts, error messages).

      ═══════════════════════════════════════════════════════════════════════

      🚨 REMINDER: MANDATORY OUTPUT FORMAT 🚨

      If tests PASS:
      STATUS: done
      TESTS_PASSED: true
      TEST_OUTPUT: <summary — e.g. "14 passed, 0 failed">

      If tests FAIL:
      STATUS: fail
      TESTS_PASSED: false
      TEST_OUTPUT: <summary of failures with file names and error messages>

      If tests pass, use STATUS: done. If tests fail, use STATUS: fail so the
      pipeline can retry the develop step.
    expects: "STATUS: done"
    max_retries: 0
    on_fail:
      retry_step: develop
      max_retries: 2
      escalate_to: human

  - id: audit
    agent: auditor
    input: |
      Review the code changes on branch {{branch_name}} for {{ticket_id}}.

      BRANCH: {{branch_name}}
      REPO: Amakaflow/amakaflow-ui
      REPO_FALLBACK: {{repo}}
      TICKET: {{ticket_id}}
      CHANGED_FILES: {{changed_files}}

      ⚠️ There is NO Pull Request yet. Review the branch directly.

      ⚠️ FALLBACK: If BRANCH contains "[missing:" values, discover it:
        git ls-remote --heads https://github.com/Amakaflow/amakaflow-ui.git "refs/heads/feature/{{ticket_id}}*"
        Use the first matching branch name.

      Task:
      1. Clone/checkout the branch:
         git clone https://github.com/Amakaflow/amakaflow-ui.git /tmp/{{ticket_id}}-audit || true
         cd /tmp/{{ticket_id}}-audit
         git fetch origin <branch>
         git checkout <branch>

      2. View the diff against develop:
         git diff origin/develop...HEAD

      3. Read the changed files and check for:
         - Security issues (injection, auth bypass, credential leaks)
         - Missing input validation
         - Error handling (specific exceptions, not bare catch-all)
         - Type safety (TypeScript types correct, no any casts)
         - Performance concerns (unnecessary re-renders, missing memo/callback)
         - Code style consistency with the rest of the codebase

      4. Generate audit report with specific file paths and line numbers

      If all checks pass (no critical issues):
      STATUS: done
      AUDIT_RESULT: pass
      RECOMMENDATIONS: (optional minor suggestions)

      If issues found that need fixing:
      STATUS: done
      AUDIT_RESULT: fail
      ISSUES:
        - Issue 1 (file:line): description
        - Issue 2 (file:line): description
      RECOMMENDATIONS:
        - Fix 1
        - Fix 2

      If critical blockers (security vulnerabilities, data loss risk):
      STATUS: escalate
      CRITICAL_ISSUES:
        - Blocker 1
        - Blocker 2
    expects: "STATUS: done"
    on_fail:
      escalate_to: human

  - id: fix_and_pr
    agent: developer
    timeoutSeconds: 600
    input: |
      🚨 CRITICAL: OUTPUT FORMAT REQUIREMENTS (READ THIS FIRST) 🚨

      You MUST respond with EXACTLY these three keys:

      STATUS: done
      PR_NUMBER: #142
      PR_URL: https://github.com/Amakaflow/amakaflow-ui/pull/142

      ═══════════════════════════════════════════════════════════════════════

      Fix any audit issues on branch {{branch_name}} for {{ticket_id}}, then create a PR.

      BRANCH: {{branch_name}}
      REPO: Amakaflow/amakaflow-ui
      REPO_FALLBACK: {{repo}}
      TICKET: {{ticket_id}}
      AUDIT_RESULT: {{audit_result}}
      ISSUES: {{issues}}
      RECOMMENDATIONS: {{recommendations}}

      ⚠️ FALLBACK: If BRANCH contains "[missing:" values, discover it:
        git ls-remote --heads https://github.com/Amakaflow/amakaflow-ui.git "refs/heads/feature/{{ticket_id}}*"

      Task:
      1. Check out the branch:
         cd /tmp/{{ticket_id}}-work && git checkout <branch> && git pull origin <branch>
         OR if directory doesn't exist:
         git clone https://github.com/Amakaflow/amakaflow-ui.git /tmp/{{ticket_id}}-work
         cd /tmp/{{ticket_id}}-work && git checkout <branch>

      1b. CHECK FOR EXISTING PR WITH ISSUES (this step may be retried after merge failure):
         - Check if a PR already exists for this branch:
           gh pr list --repo Amakaflow/amakaflow-ui --head <branch> --state open --json number,url,statusCheckRollup,reviews
         - If a PR exists, ALWAYS check for BOTH CI failures AND CHANGES_REQUESTED reviews:
           a. Get full details:
              gh pr view <pr_number> --repo Amakaflow/amakaflow-ui --json reviews,statusCheckRollup \
                --jq '{blocking_reviews: [.reviews[] | select(.state == "CHANGES_REQUESTED") | {author: .author.login, body: .body}], failed_checks: [.statusCheckRollup[] | select(.conclusion == "FAILURE") | .name]}'
           b. Read all inline PR review comments:
              gh api repos/Amakaflow/amakaflow-ui/pulls/<pr_number>/comments --jq '[.[] | {body: .body, path: .path, line: .original_line}]'
           c. If CHANGES_REQUESTED reviews exist OR CI failures exist:
              - Read EVERY review body and inline comment carefully
              - Fix ALL issues mentioned (review feedback AND CI failures)
              - Run tests locally to verify fixes: npm test || npx vitest run
              - Commit: git commit -am "fix: address code review feedback for {{ticket_id}}"
              - Push: git push origin <branch>
           d. Skip to step 5 (PR already exists, just report its number/URL)

      2. If AUDIT_RESULT is "pass":
         - No code fixes needed, skip to step 4
      3. If AUDIT_RESULT is "fail":
         - Read the ISSUES and RECOMMENDATIONS carefully
         - Fix each issue in the code
         - Run tests to make sure fixes don't break anything: npm test || npx vitest run
         - Commit fixes: git commit -am "fix: address audit feedback for {{ticket_id}}"
         - Push: git push origin <branch>

      3b. REBASE CHECK — before creating the PR, ensure the branch is up to date with develop:
         a. Check how far behind develop the branch is:
            gh api repos/Amakaflow/amakaflow-ui/compare/develop...<branch> --jq .behind_by
         b. If behind_by > 0:
            git fetch origin develop
            git rebase origin/develop
            - If rebase succeeds: git push --force-with-lease origin <branch>
            - If rebase fails (conflicts):
              git rebase --abort
              Reply STATUS: escalate with REASON: rebase conflict — manual resolution required, list the conflicted files
         c. If behind_by == 0: continue to step 4

      4. Create a Pull Request to develop:
         gh pr create --repo Amakaflow/amakaflow-ui --base develop --head <branch> \
           --title "{{ticket_id}}: {{title}}" \
           --body "Implements {{ticket_id}} — {{title}}"

      5. Capture the PR number and URL from the gh pr create output.

      ═══════════════════════════════════════════════════════════════════════

      🚨 REMINDER: MANDATORY OUTPUT FORMAT 🚨

      STATUS: done
      PR_NUMBER: #<number>
      PR_URL: https://github.com/Amakaflow/amakaflow-ui/pull/<number>

      - STATUS must be "done"
      - PR_NUMBER must start with # followed by the number
      - PR_URL must be the complete GitHub pull request URL

      DO NOT use any other key names. DO NOT omit any keys.
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: merge
    agent: closer
    input: |
      Merge PR {{pr_number}} for {{ticket_id}} into develop, verify, and clean up.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: Amakaflow/amakaflow-ui
      REPO_FALLBACK: {{repo}}
      TICKET: {{ticket_id}}

      ⚠️ CRITICAL: Do NOT use sleep, wait, or polling loops. Check ONCE and return immediately.
      🚨 ABSOLUTE RULE: Do NOT fabricate, guess, or invent a merge SHA. You MUST get it from the GitHub API.

      ⚠️ FALLBACK: If PR or URL contain "[missing:" values, discover the PR:
        1. Find the open PR for this ticket:
           gh pr list --repo Amakaflow/amakaflow-ui --state open --json number,url,headRefName \
             --jq '.[] | select(.headRefName | contains("{{ticket_id}}"))'
        2. If NO open PR is found, check for a closed PR with real work on the branch:
           a. Find the closed PR:
              gh pr list --repo Amakaflow/amakaflow-ui --state closed --json number,url,headRefName \
                --jq '.[] | select(.headRefName | contains("{{ticket_id}}"))'
           b. If a closed PR exists, check if the branch still has commits above develop:
              gh api repos/Amakaflow/amakaflow-ui/compare/develop...<branch-name> --jq .ahead_by
           c. If ahead_by > 0, the branch has real work — reopen the PR:
              gh pr reopen <pr_number> --repo Amakaflow/amakaflow-ui
              Then use this PR for all subsequent steps.
           d. If ahead_by == 0, the branch is empty — reply STATUS: escalate with REASON: branch has no commits above develop.

      Task:
      0. Check if PR is already merged (handle re-run case):
         gh pr view <pr_number> --repo Amakaflow/amakaflow-ui --json state,mergeCommit --jq '{state: .state, sha: .mergeCommit.oid}'
         If state is "MERGED": skip to step 5 verification directly.

      1. Check that CI checks have passed (ONE check, no polling):
         gh pr checks <pr_number> --repo Amakaflow/amakaflow-ui
         If checks are still running, wait up to 60 seconds checking every 10 seconds.
         ⚠️ IMPORTANT: Only escalate if a REQUIRED check fails. Non-required checks (like
         validate-ticket, claude-comment) may fail without blocking merge — ignore them.
         To identify required checks, use:
           gh api repos/Amakaflow/amakaflow-ui/branches/main/protection --jq '.required_status_checks.contexts'
         Only escalate if a check listed as required has failed.

         🚨 SPECIAL CASE — if the failing required check is named "review":
         This means the automated Claude code review found Critical or Major issues.
         Do NOT retry fix_and_pr. Instead:
           1. Get the review comment:
              gh pr view <pr_number> --repo Amakaflow/amakaflow-ui --json comments \
                --jq '[.comments[] | select(.body | contains("## Automated Code Review"))] | last | .body'
           2. Send a Telegram notification:
              openclaw message send --channel telegram --to 7888191549 \
                "🔍 **Claude review blocked merge for {{ticket_id}}**\n\nPR: <pr_url>\n\nThe automated review found issues that need attention. Please review the PR comment and decide whether to approve or request fixes."
           3. Reply immediately:
              STATUS: escalate
              REASON: Claude review (required check) failed — human review needed
              PR_NUMBER: <pr_number>
              PR_URL: <pr_url>

      1b. CHECK FOR BLOCKING REVIEWS before attempting merge:
         gh pr view <pr_number> --repo Amakaflow/amakaflow-ui --json reviews,mergeStateStatus \
           --jq '{status: .mergeStateStatus, blocking: [.reviews[] | select(.state == "CHANGES_REQUESTED") | {author: .author.login, body: .body}]}'
         If CHANGES_REQUESTED reviews are present:
           - Collect the full review feedback text from each blocking review
           - Post a comment on the PR to notify Joshua:
             gh pr comment <pr_number> --repo Amakaflow/amakaflow-ui --body "⚠️ **Automated merge blocked — action required**\n\nThis PR cannot be merged because a code review has requested changes.\n\n**Review feedback:**\n$(review body text here)\n\n**Joshua**: Please review the feedback above. If the automated fix attempts are exhausted, manual intervention is needed. Re-push the branch after fixing to re-trigger the pipeline."
           - Then reply immediately:
             STATUS: escalate
             REASON: CHANGES_REQUESTED — code review feedback must be addressed before merging
             REVIEW_FEEDBACK: <concatenated text of all review bodies>
             PR_NUMBER: <pr_number>
             PR_URL: <pr_url>

      2. Check if the PR is mergeable:
         gh pr view <pr_number> --repo Amakaflow/amakaflow-ui --json mergeable,mergeStateStatus

      3. If mergeable: merge with squash:
         gh pr merge <pr_number> --repo Amakaflow/amakaflow-ui --squash --delete-branch
         IMPORTANT: Check the exit code. If the command fails, do NOT proceed — report STATUS: escalate.

      4. If NOT mergeable (conflicts with develop): attempt rebase:
         a. cd /tmp/{{ticket_id}}-work || git clone https://github.com/Amakaflow/amakaflow-ui.git /tmp/{{ticket_id}}-work
         b. cd /tmp/{{ticket_id}}-work && git checkout <branch> && git fetch origin develop
         c. git rebase origin/develop
         d. If rebase succeeds: git push --force-with-lease, then try merge again
         e. If rebase fails: git rebase --abort, then reply STATUS: escalate

      5. MANDATORY VERIFICATION — Do NOT skip this step:
         gh pr view <pr_number> --repo Amakaflow/amakaflow-ui --json state,mergeCommit --jq '{state: .state, sha: .mergeCommit.oid}'
         - If state is "MERGED": extract the sha. This is your MERGE_SHA.
         - If state is NOT "MERGED": reply STATUS: escalate.
         - If sha is null or empty: reply STATUS: escalate.

      If merge fails at any point:
      STATUS: escalate
      REASON: <why it failed — include exact error output>

      If merge succeeded AND state=MERGED AND you have a real SHA:
      STATUS: done
      MERGE_SHA: <the exact sha from gh pr view — NOT invented>
      TICKET: {{ticket_id}}
      MERGED: true
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      retry_step: fix_and_pr
      max_retries: 2
      escalate_to: human

  - id: post_merge
    agent: closer
    input: |
      Verify merge and clean up for {{ticket_id}}.

      TICKET: {{ticket_id}}
      REPO: Amakaflow/amakaflow-ui
      MERGE_SHA: {{merge_sha}}

      ⚠️ CRITICAL: Do NOT use sleep, wait, or polling loops. Check ONCE and return immediately.

      Task:
      0. MANDATORY FIRST CHECK — verify the PR is actually merged (prevent false positives):
         gh pr list --repo Amakaflow/amakaflow-ui --state all --search "{{ticket_id}}" --json number,state,mergeCommit \
           --jq '.[] | {number, state, sha: .mergeCommit.oid}'
         - If state is NOT "MERGED": reply STATUS: escalate with REASON: PR is still open — merge did not complete
         - If state is "MERGED" but sha is null/empty: reply STATUS: escalate with REASON: PR merged but no commit SHA found
         - Only proceed if state == "MERGED" AND sha is present

      1. Verify the merge commit exists on develop:
         gh api repos/Amakaflow/amakaflow-ui/commits/{{merge_sha}} --jq '.sha' 2>/dev/null
         If MERGE_SHA contains "[missing:", use the sha discovered in step 0 above.

      2. Clean up work directories:
         rm -rf /tmp/{{ticket_id}}-work /tmp/{{ticket_id}}-audit 2>/dev/null || true

      3. Report results:

      If verification succeeded:
      STATUS: done
      VERIFIED: true
      CLEANUP: done

      If verification failed:
      STATUS: escalate
      REASON: <why verification failed>
    expects: "STATUS: done"
    on_fail:
      escalate_to: human

steps_flow:
  - pick_ticket
  - develop
  - run_tests
  - audit
  - fix_and_pr
  - merge
  - post_merge
