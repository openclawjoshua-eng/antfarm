id: ai-developer
name: AI Developer Workflow
version: 2
description: |
  General-purpose AI developer pipeline.
  - Ticket Picker: Picks next Linear ticket from project backlog
  - Developer: Implements code with MiniMax-M2.5
  - Auditor: Pre-reviews with DeepSeek (security + best practices)
  - Closer: Monitors PR status, handles post-merge cleanup

context:
  repo: supergeri/mapper-api
  linear_project: AMA
  linear_team: MyAmaka

polling:
  model: anthropic/claude-haiku-4-5-20251001
  timeoutSeconds: 300

agents:
  - id: ticket_picker
    name: Ticket Picker
    role: analysis
    model: anthropic/claude-haiku-4-5-20251001
    description: Picks next ready Linear ticket from project backlog
    workspace:
      baseDir: agents/ticket_picker
      files:
        AGENTS.md: agents/ticket_picker/AGENTS.md

  - id: developer
    name: Developer
    role: coding
    model: minimax/MiniMax-M2.5
    description: Implements ticket code with MiniMax-M2.5
    workspace:
      baseDir: agents/developer
      files:
        AGENTS.md: agents/developer/AGENTS.md

  - id: auditor
    name: Auditor (DeepSeek)
    role: analysis
    model: deepseek/deepseek-chat
    description: Pre-reviews code for security + performance before PR
    workspace:
      baseDir: agents/auditor
      files:
        AGENTS.md: agents/auditor/AGENTS.md

  - id: closer
    name: Closer
    role: analysis
    model: anthropic/claude-haiku-4-5-20251001
    description: Monitors PR status, handles post-merge cleanup
    workspace:
      baseDir: agents/closer
      files:
        AGENTS.md: agents/closer/AGENTS.md

steps:
  - id: pick_ticket
    agent: ticket_picker
    input: |
      TASK: "{{task}}"

      ⚠️ CRITICAL RULE — READ THIS FIRST:
      Extract any ticket ID (like AMA-607, AMA-123, etc.) from the TASK above.
      If a ticket ID is present, you MUST look up THAT EXACT ticket in Linear
      and return its details. Do NOT search the backlog. Do NOT pick a different
      ticket. Just fetch the one specified and return it.
      HOWEVER — before returning it, check for an existing open PR (see step 0 below).

      Step 0 — DUPLICATE WORK CHECK (run before selecting ANY ticket):
      Check for existing open PRs in the repo:
        gh pr list --repo {{repo}} --state open --json title,number,headRefName
      For each candidate ticket ID, check if any open PR's title or branch name
      contains that ticket ID (e.g., "AMA-607" appears in the PR title or branch).
      If an open PR already exists for a ticket:
        - If the TASK specified that exact ticket ID, reply:
          STATUS: duplicate
          TICKET_ID: <the ticket ID>
          EXISTING_PR: <the PR number and URL>
          REASON: An open PR already exists for this ticket
        - If picking from the backlog, skip that ticket and pick the next one.

      ONLY if the TASK contains NO ticket ID, then pick from the backlog:
      1. Query Linear for issues in the {{linear_team}} team where:
         - Status is "Todo", "In Progress", or "Ready"
         - Not blocked by unfinished dependencies
      2. SKIP these ticket types (they are not coding tasks):
         - Tickets with "SPIKE" in the title (research/planning tasks)
         - Tickets with "SPIKE" label
         - Tickets that are purely documentation or research with no code changes
      3. Sort by priority (Urgent > High > Medium > Low > No priority)
      4. Pick the highest-priority unblocked CODING ticket that has NO existing open PR
      5. Get full ticket details: title, description, acceptance criteria
      6. If no tickets are ready (or all have existing PRs), reply with STATUS: no_work

      Reply with EXACTLY this format:
      STATUS: done
      TICKET_ID: <the ticket ID, e.g. AMA-607>
      TITLE: <ticket title>
      DESCRIPTION: <full description from Linear>
      ACCEPTANCE_CRITERIA: |
        - Criterion 1
        - Criterion 2
    expects: "STATUS: done"
    max_retries: 1
    on_fail:
      escalate_to: human

  - id: develop
    agent: developer
    timeoutSeconds: 600
    input: |
      🚨 CRITICAL: OUTPUT FORMAT REQUIREMENTS (READ THIS FIRST) 🚨

      FAILURE TO USE EXACT KEY NAMES WILL BREAK THE PIPELINE AND CAUSE SYSTEM FAILURE.

      You MUST respond with EXACTLY these four keys — NO substitutions, NO variations:

      STATUS: done
      CHANGED_FILES: file1.py, file2.py
      PR_NUMBER: #142
      PR_URL: https://github.com/supergeri/mapper-api/pull/142

      ❌ WRONG key names that will BREAK the system:
      - CHANGES: (wrong — must be CHANGED_FILES)
      - FILES: (wrong — must be CHANGED_FILES)
      - TESTS: (wrong — not a valid key)
      - PR: (wrong — must be PR_NUMBER and PR_URL)
      - PULL_REQUEST: (wrong — must be PR_NUMBER and PR_URL)

      ✅ CORRECT example output:
      STATUS: done
      CHANGED_FILES: src/api/routes.py, src/models/user.py, tests/test_routes.py
      PR_NUMBER: #142
      PR_URL: https://github.com/supergeri/mapper-api/pull/142

      ALL FOUR KEYS ARE MANDATORY. Missing any key will cause pipeline failure.

      ═══════════════════════════════════════════════════════════════════════

      Implement {{ticket_id}} ({{title}}) in the {{repo}} repository.

      TICKET: {{ticket_id}}
      TITLE: {{title}}
      DESCRIPTION: {{description}}
      ACCEPTANCE_CRITERIA:
      {{acceptance_criteria}}

      Instructions:
      1. Clone the repo fresh or ensure it's up to date:
         git clone https://github.com/{{repo}}.git /tmp/{{ticket_id}}-work || true
         cd /tmp/{{ticket_id}}-work && git checkout main && git pull origin main
      2. Create feature branch FROM latest main:
         git checkout -b feature/{{ticket_id}}-short-name
      3. Read existing code to understand patterns and style
      4. Implement the changes per the acceptance criteria
      5. Run any available tests to verify
      6. Commit with a clear message referencing {{ticket_id}}
      7. Push the branch
      8. Create PR to main with {{ticket_id}} in the title

      ═══════════════════════════════════════════════════════════════════════

      🚨 REMINDER: MANDATORY OUTPUT FORMAT (USE EXACT KEY NAMES) 🚨

      Your response MUST contain EXACTLY these four keys:

      STATUS: done
      CHANGED_FILES: file1.py, file2.py, file3.py
      PR_NUMBER: #142
      PR_URL: https://github.com/supergeri/mapper-api/pull/142

      - STATUS must be "done"
      - CHANGED_FILES must list all modified files (comma-separated)
      - PR_NUMBER must start with # followed by the number
      - PR_URL must be the complete GitHub pull request URL

      DO NOT use any other key names. DO NOT add extra keys. DO NOT omit any keys.
      Using wrong key names (like CHANGES, FILES, TESTS, PR, etc.) will break the pipeline.
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: run_tests
    agent: developer
    timeoutSeconds: 600
    input: |
      Run the test suite for {{ticket_id}} to verify the implementation works.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: {{repo}}
      TICKET: {{ticket_id}}
      CHANGED_FILES: {{changed_files}}

      Task:
      1. Check out the PR branch:
         cd /tmp/{{ticket_id}}-work && git pull origin
         OR if directory doesn't exist:
         gh pr checkout {{pr_number}} --repo {{repo}}

      2. Set up the Python test environment:
         python3 -m venv .venv
         source .venv/bin/activate
         pip install -r requirements-dev.txt 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      3. Run unit and integration tests:
         pytest tests/ -m "unit or integration" -v --tb=short 2>&1

         If no pytest markers exist, run:
         pytest tests/ -v --tb=short 2>&1

      4. Analyze the results:
         - If ALL tests pass: report STATUS: done
         - If tests FAIL: report STATUS: tests_failed with full failure output

      If tests pass, reply:
      STATUS: done
      TESTS_PASSED: <number of tests passed>
      TEST_OUTPUT: <summary of test results>

      If tests fail, reply:
      STATUS: tests_failed
      TESTS_FAILED: <number of tests failed>
      FAILURE_OUTPUT: |
        <full pytest output showing failures — include tracebacks>
      SUGGESTED_FIXES: |
        <what you think needs to change based on the failures>
    expects: "STATUS: done"
    max_retries: 1
    on_fail:
      retry_step: develop
      max_retries: 2
      on_exhausted:
        escalate_to: human

  - id: audit
    agent: auditor
    input: |
      Pre-review the changes for {{ticket_id}} before merging.

      CHANGED_FILES: {{changed_files}}
      TICKET: {{ticket_id}}
      PR: {{pr_url}}

      Task:
      1. Read the changed files in the PR
      2. Check for:
         - Security issues (injection, auth bypass, credential leaks)
         - Missing input validation
         - Error handling (specific exceptions, not bare catch-all)
         - Type safety
         - Performance concerns (N+1, blocking calls, etc.)
         - Code style consistency with the rest of the codebase
      3. Generate audit report with specific file paths and line numbers
      4. If issues found, output them for developer to fix

      Reply with:
      STATUS: done
      AUDIT_RESULT: pass|fail
      ISSUES: (if any)
        - Issue 1 (file:line)
        - Issue 2 (file:line)
      RECOMMENDATIONS:
        - Fix 1
        - Fix 2

      Or if critical issues:
      STATUS: escalate
      CRITICAL_ISSUES:
        - Blocker 1
        - Blocker 2
    expects: "STATUS: done"
    on_fail:
      retry_step: develop
      max_retries: 1

  - id: fix_review
    agent: developer
    timeoutSeconds: 600
    input: |
      Check PR {{pr_number}} for code review feedback and fix any requested changes.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: {{repo}}
      TICKET: {{ticket_id}}

      Task:
      1. Run: gh pr view {{pr_number}} --repo {{repo}} --json reviews,comments,reviewDecision
         (Note: "gh pr reviews" does NOT support --json. Always use "gh pr view --json reviews")
      2. If reviewDecision is "APPROVED" or no reviews exist yet, reply:
         STATUS: done
         REVIEW_STATE: approved
         (This is a pass-through — no fixes needed)
      3. If reviewDecision is "CHANGES_REQUESTED" or any review has state "CHANGES_REQUESTED":
         a. Read ALL review comments carefully
         b. Check out the PR branch: gh pr checkout {{pr_number}} --repo {{repo}}
         c. Make the requested fixes in the code
         d. Run any available tests to verify
         e. Commit with message: "fix: address code review feedback for {{ticket_id}}"
         f. Push the changes
         g. Reply with:
            STATUS: done
            REVIEW_STATE: fixed
            FIXES: summary of what you fixed

      Reply with:
      STATUS: done
      REVIEW_STATE: approved|fixed
    expects: "STATUS: done"
    max_retries: 1
    on_fail:
      escalate_to: human

  - id: wait_review
    agent: closer
    input: |
      Check PR {{pr_number}} for code review status.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: {{repo}}

      ⚠️ CRITICAL: Do NOT use sleep, wait, or polling loops. Check ONCE and return immediately.
      Do NOT use "gh pr reviews" — that command does not support --json.

      Task:
      1. Check CI status (ONE check, no polling):
         gh pr checks {{pr_number}} --repo {{repo}}

      2. Get review data:
         gh pr view {{pr_number}} --repo {{repo}} --json reviews,reviewDecision,state,statusCheckRollup

      3. Evaluate review status using this logic:
         - reviewDecision is "APPROVED" → STATUS: approved
         - Any review with state "APPROVED" → STATUS: approved
         - Any review with state "COMMENTED" and body contains "approved" → STATUS: approved
           (Note: automated code review bots like Claude use COMMENTED state, not APPROVED.
            Treat COMMENTED reviews as approval unless they explicitly request changes.)
         - reviewDecision is "CHANGES_REQUESTED" → STATUS: changes_requested
         - Any review with state "CHANGES_REQUESTED" → STATUS: changes_requested
         - No reviews at all AND all CI checks pass → STATUS: approved
         - No reviews AND CI checks fail or pending → STATUS: changes_requested

      If approved, reply:
      STATUS: approved

      If changes requested, reply:
      STATUS: changes_requested
      REVIEW_FEEDBACK: <the review comments>
    expects: "STATUS: approved"
    max_retries: 3
    on_fail:
      retry_step: fix_review
      max_retries: 3
      on_exhausted:
        escalate_to: human

  - id: merge_pr
    agent: closer
    input: |
      Merge PR {{pr_number}} for {{ticket_id}} into main.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: {{repo}}
      TICKET: {{ticket_id}}

      ⚠️ CRITICAL: Do NOT use sleep, wait, or polling loops. Check ONCE and return immediately.
      🚨 ABSOLUTE RULE: Do NOT fabricate, guess, or invent a merge SHA. You MUST get it from the GitHub API. If you cannot confirm the merge, report STATUS: escalate.

      Task:
      1. Check that CI checks have passed (ONE check, no polling):
         gh pr checks {{pr_number}} --repo {{repo}}
         If checks are still running or failing, reply STATUS: escalate with details.

      2. Check if the PR is mergeable:
         gh pr view {{pr_number}} --repo {{repo}} --json mergeable,mergeStateStatus

      3. If mergeable: merge with squash:
         gh pr merge {{pr_number}} --repo {{repo}} --squash --delete-branch
         IMPORTANT: Check the exit code. If the command fails, do NOT proceed — report STATUS: escalate.

      4. If NOT mergeable (conflicts with main): attempt rebase:
         a. Clone/cd into the repo work directory:
            git clone https://github.com/{{repo}}.git /tmp/{{ticket_id}}-merge || true
            cd /tmp/{{ticket_id}}-merge
         b. gh pr checkout {{pr_number}} --repo {{repo}}
         c. git fetch origin main
         d. git rebase origin/main
         e. If rebase succeeds (no conflicts): git push --force-with-lease, then try merge again
         f. If rebase fails (conflicts): git rebase --abort, then reply STATUS: escalate

      5. MANDATORY VERIFICATION — Do NOT skip this step:
         Run this command and capture the output:
         gh pr view {{pr_number}} --repo {{repo}} --json state,mergeCommit --jq '{state: .state, sha: .mergeCommit.oid}'

         - If state is "MERGED": extract the sha from the output. This is your MERGE_SHA.
         - If state is NOT "MERGED": the merge failed. Reply STATUS: escalate.
         - If the sha field is null or empty: Reply STATUS: escalate.

      If the merge fails at any point, reply with:
      STATUS: escalate
      REASON: why the merge failed (include exact error output)

      If the merge succeeded AND you confirmed state=MERGED AND you have a real SHA:
      STATUS: done
      MERGE_SHA: <the exact sha from gh pr view output — NOT invented>
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: post_merge
    agent: closer
    input: |
      {{ticket_id}} PR {{pr_number}} has been merged. Verify the merge and confirm.

      TICKET: {{ticket_id}}
      PR: {{pr_number}}
      REPO: {{repo}}

      Task:
      1. Verify the PR was actually merged:
         gh pr view {{pr_number}} --repo {{repo}} --json state,mergedAt --jq '{state, mergedAt}'
      2. Verify the merge commit is on main:
         gh api repos/{{repo}}/commits/main --jq '.sha' 2>/dev/null || echo "could not verify"
      3. Clean up the local work directory if it exists:
         rm -rf /tmp/{{ticket_id}}-work /tmp/{{ticket_id}}-merge 2>/dev/null || true

      Note: The Linear ticket status will be updated automatically by the poller.
      Do NOT attempt to modify Linear or write to any files.

      Reply with:
      STATUS: done
      TICKET: {{ticket_id}}
      MERGED: true
    expects: "STATUS: done"
    on_fail:
      escalate_to: human

steps_flow:
  - pick_ticket
  - develop
  - run_tests
  - audit
  - fix_review
  - wait_review
  - merge_pr
  - post_merge
