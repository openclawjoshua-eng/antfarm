id: ai-developer
name: AI Developer Workflow
version: 6
description: |
  Hybrid 7-step AI developer pipeline.
  - Ticket Picker: Picks next Linear ticket from project backlog
  - Developer: Implements code + commits to branch (NO PR)
  - Developer: Runs tests on the branch (retries develop on failure)
  - Auditor: Reviews code on branch for security + best practices
  - Developer: Fixes audit issues + creates PR
  - Closer: Merges PR
  - Closer: Verifies merge + cleans up work directories

notifications:
  url: http://127.0.0.1:9876

context:
  repo: Amakaflow/amakaflow-backend
  linear_project: AMA
  linear_team: MyAmaka

polling:
  model: moonshot/kimi-k2.5
  timeoutSeconds: 300

cron:
  timeout_seconds: 0

agents:
  - id: picker
    name: Ticket Picker
    role: analysis
    model: moonshot/kimi-k2.5
    description: Picks next ready Linear ticket from project backlog
    workspace:
      baseDir: agents/picker
      files:
        AGENTS.md: agents/picker/AGENTS.md

  - id: mini-developer
    name: Mini-Developer Orchestrator
    role: coding
    model: moonshot/kimi-k2.5
    description: Thin orchestrator that runs mini-agent (MiniMax M2.5) to implement tickets
    workspace:
      baseDir: agents/developer
      files:
        AGENTS.md: agents/developer/AGENTS.md

  - id: developer
    name: Developer
    role: coding
    model: minimax/MiniMax-M2.5-highspeed
    description: Implements ticket code with MiniMax-M2.5
    workspace:
      baseDir: agents/developer
      files:
        AGENTS.md: agents/developer/AGENTS.md

  - id: auditor
    name: Auditor
    role: analysis
    model: anthropic/claude-haiku-4-5-20251001
    description: Reviews code on branch for security + performance
    workspace:
      baseDir: agents/auditor
      files:
        AGENTS.md: agents/auditor/AGENTS.md

  - id: closer
    name: Closer
    role: analysis
    model: anthropic/claude-haiku-4-5-20251001
    description: Merges PR, verifies, cleans up
    workspace:
      baseDir: agents/closer
      files:
        AGENTS.md: agents/closer/AGENTS.md

steps:
  - id: pick_ticket
    agent: picker
    input: |
      🚨 CRITICAL: OUTPUT FORMAT REQUIREMENTS (READ THIS FIRST) 🚨

      Your response MUST end with EXACTLY these keys on separate lines — plain text, no markdown:

      STATUS: done
      TICKET_ID: AMA-607
      TITLE: the ticket title here
      DESCRIPTION: the full description here
      ACCEPTANCE_CRITERIA: |
        - Criterion 1
        - Criterion 2

      ❌ Do NOT use markdown headers, JSON, bullet lists, or any other format.
      ❌ Do NOT omit any key. Missing keys will BREAK the pipeline.
      ✅ Each key must be on its own line followed by a colon and a space.

      ═══════════════════════════════════════════════════════════════════════

      TASK: "{{task}}"

      ⚠️ CRITICAL RULE — READ THIS FIRST:
      Extract any ticket ID (like AMA-607, AMA-123, etc.) from the TASK above.
      If a ticket ID is present, you MUST look up THAT EXACT ticket in Linear
      and return its details. Do NOT search the backlog. Do NOT pick a different
      ticket. Just fetch the one specified and return it.
      HOWEVER — before returning it, check for an existing open PR (see step 0 below).

      Step 0 — DUPLICATE WORK CHECK (run before selecting ANY ticket):
      Check for existing open PRs across ALL Amakaflow repos:
        gh pr list --repo Amakaflow/amakaflow-backend --state open --json title,number,headRefName,url
        gh pr list --repo Amakaflow/amakaflow-ui --state open --json title,number,headRefName,url
        gh pr list --repo Amakaflow/amakaflow-ios-app --state open --json title,number,headRefName,url
        gh pr list --repo Amakaflow/amakaflow-android-app --state open --json title,number,headRefName,url
        gh pr list --repo Amakaflow/amakaflow-automation --state open --json title,number,headRefName,url
      For each candidate ticket ID, check if any open PR's title or branch name
      contains that ticket ID (e.g., "AMA-607" appears in the PR title or branch).
      If an open PR already exists for a ticket:
        - If the TASK specified that exact ticket ID, reply:
          STATUS: duplicate
          TICKET_ID: <the ticket ID>
          EXISTING_PR: <the PR number and URL>
          REASON: An open PR already exists for this ticket
        - If picking from the backlog, skip that ticket and pick the next one.

      ONLY if the TASK contains NO ticket ID, then pick from the backlog:
      1. Query Linear for issues in the {{linear_team}} team where:
         - Status is "Todo", "In Progress", or "Ready"
         - Not blocked by unfinished dependencies
      2. SKIP these ticket types (they are not coding tasks):
         - Tickets with "SPIKE" in the title (research/planning tasks)
         - Tickets with "SPIKE" label
         - Tickets whose title starts with "Research:" (routed to deep-research workflow)
         - Tickets that are purely documentation or research with no code changes
      3. Sort by priority (Urgent > High > Medium > Low > No priority)
      4. Pick the highest-priority unblocked CODING ticket that has NO existing open PR
      5. Get full ticket details: title, description, acceptance criteria
      6. If no tickets are ready (or all have existing PRs), reply with STATUS: no_work

      After selecting a ticket, BEFORE returning output:
      7. Check the ticket description for these two required CI fields:
         - "## Repo:" line (e.g. "## Repo: Amakaflow/amakaflow-android-app")
         - "## Test command:" line (e.g. "## Test command: ./gradlew :app:testDebugUnitTest")
         If EITHER is missing, patch the Linear ticket description via GraphQL mutation to add them
         at the top of the description. Use the repo you've identified from the ticket content.
         Repo mapping:
           - Python/FastAPI backend (mapper, workouts, users, chat, AI) → Amakaflow/amakaflow-backend
           - TypeScript/React (.tsx) → Amakaflow/amakaflow-ui
           - iOS app (Swift, Xcode, .swift) → Amakaflow/amakaflow-ios-app
           - Android (Kotlin, .kt, Compose) → Amakaflow/amakaflow-android-app
           - Maestro/e2e tests → Amakaflow/amakaflow-automation
         Test command mapping:
           - Android → ./gradlew :app:testDebugUnitTest
           - Python → pytest
           - TypeScript/React → npm test
           - iOS → xcodebuild test -scheme AmakaFlow -destination 'platform=iOS Simulator,name=iPhone 16'
           - Other → npm test
         Use this mutation (replace ISSUE_ID and NEW_DESCRIPTION):
           mutation { issueUpdate(id: "ISSUE_ID", input: { description: "NEW_DESCRIPTION" }) { success } }
         Return the PATCHED description in your DESCRIPTION output key.

      7b. APIFY / EXTERNAL SERVICE ID CHECK:
         Scan the ticket DESCRIPTION for mentions of "Apify", "scraper", "crawler", or "ingest".
         If found, check whether the description contains a verified actor ID in one of these forms:
           - A string matching `<username>/<actor-name>` cited with a URL (e.g. https://apify.com/...)
           - An explicit "Actor:" or "Apify actor:" field
         If the description mentions Apify/scraping but does NOT include a verified actor ID:
           a. Add a ⚠️ warning block at the top of the ticket description via issueUpdate:
              "⚠️ UNVERIFIED ACTOR ID — Before implementing, confirm the exact Apify actor ID at
              https://apify.com/store and add it to this ticket as: Apify actor: username/actor-name"
           b. Add a Linear comment on the ticket:
              "⚠️ This ticket references Apify/scraping but does not include a verified actor ID.
              Joshua must NOT guess or invent actor IDs. Verify at https://apify.com/store and
              update this ticket before implementing."
           Return the updated DESCRIPTION (with warning) in your DESCRIPTION output key.

      8. Set ticket state to "In Progress" in Linear:
         mutation {
           issueUpdate(id: "<ISSUE_UUID>", input: { stateId: "bafb8538-5b85-45c4-8630-7effdddbf34e" }) { success }
         }
         You already have the issue UUID from your Linear query above — use it directly.

      🚨 REMINDER: MANDATORY OUTPUT FORMAT 🚨

      STATUS: done
      TICKET_ID: <the ticket ID, e.g. AMA-607>
      ISSUE_ID: <the issue UUID from Linear, e.g. 3e2b5bda-06be-4200-804f-809dbeb06a5a>
      TITLE: <ticket title>
      DESCRIPTION: <full description from Linear>
      ACCEPTANCE_CRITERIA: |
        - Criterion 1
        - Criterion 2

      Plain text only. No markdown. No JSON. Every key required.
    expects: "STATUS: done"
    max_retries: 1
    on_fail:
      escalate_to: human

  - id: develop
    agent: mini-developer
    input: |
      You are a wrapper that coordinates mini-agent (MiniMax M2.5 native agent) to implement
      a Linear ticket. Your job is orchestration only — mini-agent does all the coding.

      TICKET: {{ticket_id}}
      TITLE: {{title}}
      DEFAULT_REPO: {{repo}}

      ── STEP 1: Determine the correct repo ──────────────────────────────────────
      Read the ticket description carefully. Pick the right repo for the Amakaflow org:
        - Python/FastAPI backend (mapper, workouts, users, chat, AI) → Amakaflow/amakaflow-backend
        - TypeScript/React frontend (.tsx, .ts, React) → Amakaflow/amakaflow-ui
        - iOS app (Swift, Xcode, .swift) → Amakaflow/amakaflow-ios-app
        - Android app (Kotlin, Compose, Gradle) → Amakaflow/amakaflow-android-app
        - Maestro test automation (yaml flows, e2e tests) → Amakaflow/amakaflow-automation
      If unclear, use DEFAULT_REPO above. Store your chosen repo as CHOSEN_REPO.

      DESCRIPTION:
      {{description}}

      ACCEPTANCE_CRITERIA:
      {{acceptance_criteria}}

      ── STEP 2: Set up workspace ─────────────────────────────────────────────────
      Run these bash commands:
        rm -rf /tmp/{{ticket_id}}-work
        mkdir -p /tmp/{{ticket_id}}-work

      ── STEP 3: Write TASK.md ────────────────────────────────────────────────────
      Write the following content to /tmp/{{ticket_id}}-work/TASK.md:

        # {{ticket_id}}: {{title}}

        ## Repo
        <CHOSEN_REPO>

        ## Description
        {{description}}

        ## Acceptance Criteria
        {{acceptance_criteria}}

        ## Instructions for implementing
        - Read the existing codebase carefully before making changes.
        - Follow existing code patterns and conventions.
        - Run tests before committing (pytest / npm test / vitest as appropriate).
        - Fix any failing tests before committing.
        - You are ALREADY on a feature branch. DO NOT create a new branch.
        - Commit all changes with message: feat({{ticket_id}}): <brief description>
        - Do NOT push — the wrapper script handles pushing after you commit.
        - Do NOT create a Pull Request.
        - Do NOT commit TASK.md itself.

      ── STEP 4: Run mini-agent ───────────────────────────────────────────────────
      Run this bash command (starts mini-agent in background):

        bash ~/.openclaw/antfarm/scripts/mini-develop.sh \
          {{ticket_id}} \
          <CHOSEN_REPO> \
          feature/{{ticket_id}}-short-name \
          > /tmp/{{ticket_id}}-result.txt 2>/tmp/{{ticket_id}}-err.txt &
        echo $! > /tmp/{{ticket_id}}-mini.pid
        echo "mini-agent started, PID $(cat /tmp/{{ticket_id}}-mini.pid)"

      ── STEP 5: Poll until complete ──────────────────────────────────────────────
      Check every 2 minutes whether the process has finished:
        kill -0 $(cat /tmp/{{ticket_id}}-mini.pid) 2>/dev/null && echo "RUNNING" || echo "DONE"

      Keep checking until you see "DONE". Between checks, do nothing except wait.
      If still RUNNING after 4 hours total, kill the process and output STATUS: fail.

      ── STEP 6: Output results ───────────────────────────────────────────────────
      Once DONE, read the result file:
        cat /tmp/{{ticket_id}}-result.txt

      Output its contents EXACTLY as your response. The file contains:
        STATUS: done
        BRANCH_NAME: feature/...
        CHANGED_FILES: ...
        REPO_NAME: ...
        BASE_BRANCH: develop

      ⚠️ Copy ALL keys from the file verbatim — including BASE_BRANCH. Do not drop any keys.

      If the file contains STATUS: fail, output that. Do not add or change anything.

      If the result file is missing or empty, check the error log:
        cat /tmp/{{ticket_id}}-err.txt
      Then output:
        STATUS: fail
        ERROR: <last 5 lines of error log>
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: run_tests
    agent: developer
    timeoutSeconds: 300
    input: |
      Read ~/.openclaw/antfarm/workflows/ai-developer/LEARNINGS.md before starting.

      Run the test suite for {{ticket_id}} on branch {{branch_name}}.

      BRANCH: {{branch_name}}
      REPO: {{repo_name}}
      REPO_FALLBACK: {{repo}}
      TICKET: {{ticket_id}}

      ⚠️ FALLBACK: If BRANCH or REPO contain "[missing:" values, discover them:
        1. Determine the actual repo: use REPO value. If it contains "[missing:", use REPO_FALLBACK.
        2. Discover the branch:
           git ls-remote --heads https://github.com/<repo>.git "refs/heads/feature/{{ticket_id}}*"
           Use the first matching branch name.

      Task:
      1. Check out the branch:
         cd /tmp/{{ticket_id}}-work && git checkout {{branch_name}} && git pull origin {{branch_name}}
         OR if directory doesn't exist:
         git clone https://github.com/<repo>.git /tmp/{{ticket_id}}-work
         cd /tmp/{{ticket_id}}-work && git checkout {{branch_name}}

      2. ANDROID/KOTLIN CHECK — before running anything, check if this is an Android project:
         ls build.gradle build.gradle.kts settings.gradle settings.gradle.kts 2>/dev/null
         If ANY of these files exist, this is an Android/Kotlin project.
         Android projects require JDK 17 + Gradle which is NOT available in this environment.
         → Skip local tests entirely. Reply immediately:
           STATUS: done
           TESTS_PASSED: true
           TEST_OUTPUT: Android/Kotlin project — local Gradle tests skipped (no JDK in agent environment). CI will run ./gradlew testDebugUnitTest on the PR.

      3. Install dependencies if needed (non-Android only):
         - If package.json exists: npm install (or npm ci if lock file exists)
         - If requirements.txt exists: pip install -r requirements.txt
         - If pyproject.toml exists: pip install -e ".[dev]" or pip install -e .

      4. Detect project type and run tests (non-Android only):
         - TypeScript/JavaScript (package.json exists):
           npm test || npx vitest run || npx jest
         - Python (pytest.ini, pyproject.toml, or tests/ directory exists):
           pytest tests/ -v --tb=short
         - If no test runner found, check for any test files and report

      5. Capture the full test output (pass/fail counts, error messages).

      ===OUTPUT FORMAT===
      Respond with EXACTLY these keys (copy this exactly, fill in values):

      If tests PASS:
      STATUS: done
      TESTS_PASSED: true
      TEST_OUTPUT: 14 passed, 0 failed

      If tests FAIL:
      STATUS: fail
      TESTS_PASSED: false
      TEST_OUTPUT: test_auth.py::test_login FAILED - AssertionError: expected 200, got 401
      ===END OUTPUT FORMAT===
    expects: "STATUS: done"
    max_retries: 0
    on_fail:
      retry_step: develop
      max_retries: 2
      escalate_to: human

  - id: audit
    agent: auditor
    input: |
      Review the code changes on branch {{branch_name}} for {{ticket_id}}.

      BRANCH: {{branch_name}}
      REPO: {{repo_name}}
      REPO_FALLBACK: {{repo}}
      BASE_BRANCH: {{base_branch}}
      TICKET: {{ticket_id}}
      CHANGED_FILES: {{changed_files}}

      ⚠️ Use BASE_BRANCH (not "main") for all git comparisons. If BASE_BRANCH contains "[missing:", detect it: gh repo view <repo> --json defaultBranchRef --jq .defaultBranchRef.name

      ⚠️ There is NO Pull Request yet. Review the branch directly.

      ⚠️ FALLBACK: If BRANCH or REPO contain "[missing:" values, discover them:
        1. Determine the actual repo: use REPO value. If it contains "[missing:", use REPO_FALLBACK.
        2. Discover the branch:
           git ls-remote --heads https://github.com/<repo>.git "refs/heads/feature/{{ticket_id}}*"
           Use the first matching branch name.
        3. If no branch found in the primary repo, also check other repos:
           gh search repos "{{ticket_id}}" --owner Amakaflow --json fullName
           Then search each for the branch.

      Task:
      1. Clone/checkout the branch (use discovered repo and branch if needed):
         git clone https://github.com/<repo>.git /tmp/{{ticket_id}}-audit || true
         cd /tmp/{{ticket_id}}-audit
         git fetch origin <branch>
         git checkout <branch>

      2. View the diff against main:
         git diff origin/<BASE_BRANCH>...HEAD

      3. Read the changed files and check for:
         - Security issues (injection, auth bypass, credential leaks)
         - Missing input validation
         - Error handling (specific exceptions, not bare catch-all)
         - Type safety
         - Performance concerns (N+1, blocking calls, etc.)
         - Code style consistency with the rest of the codebase

      3b. EXTERNAL SERVICE ID CHECK — scan the diff for hardcoded third-party identifiers:
         Look for any string in the diff that looks like an external service slug or ID:
           - Apify actor IDs: strings matching `["']([a-z0-9_-]+/[a-z0-9_-]+)["']` used as actor names
           - Any string passed to an Apify client as an actor argument
         For each such identifier found:
           a. Check whether that EXACT string appears verbatim in the ticket DESCRIPTION or ACCEPTANCE_CRITERIA
              (use the TICKET ID to fetch the Linear ticket: { issue(id: "{{ticket_id}}") { description } })
           b. If the ID does NOT appear in the ticket, it was likely invented — flag it:
              Add to ISSUES: "Unverified external service ID `<id>` at <file>:<line> — not specified
              in ticket. Verify it exists (e.g. https://apify.com/<id>) before shipping."
              Set AUDIT_RESULT: fail for this reason alone.
           c. If the ID IS in the ticket, it is verified — no issue.

      4. Generate audit report with specific file paths and line numbers

      If all checks pass (no critical issues):
      STATUS: done
      AUDIT_RESULT: pass
      RECOMMENDATIONS: (optional minor suggestions)

      If issues found that need fixing:
      STATUS: done
      AUDIT_RESULT: fail
      ISSUES:
        - Issue 1 (file:line): description
        - Issue 2 (file:line): description
      RECOMMENDATIONS:
        - Fix 1
        - Fix 2

      If critical blockers (security vulnerabilities, data loss risk):
      STATUS: escalate
      CRITICAL_ISSUES:
        - Blocker 1
        - Blocker 2
    expects: "STATUS: done"
    on_fail:
      escalate_to: human

  - id: fix_and_pr
    agent: developer
    timeoutSeconds: 600
    input: |
      🚨 CRITICAL: OUTPUT FORMAT REQUIREMENTS (READ THIS FIRST) 🚨

      You MUST respond with EXACTLY these three keys:

      STATUS: done
      PR_NUMBER: #142
      PR_URL: https://github.com/Amakaflow/amakaflow-ui/pull/142

      ═══════════════════════════════════════════════════════════════════════

      Fix any audit issues on branch {{branch_name}} for {{ticket_id}}, then create a PR.

      BRANCH: {{branch_name}}
      REPO: {{repo_name}}
      REPO_FALLBACK: {{repo}}
      BASE_BRANCH: {{base_branch}}
      ISSUE_ID: {{issue_id}}
      TICKET: {{ticket_id}}
      AUDIT_RESULT: {{audit_result}}
      ISSUES: {{issues}}
      RECOMMENDATIONS: {{recommendations}}

      ⚠️ Use BASE_BRANCH (not "main") everywhere below.
         If BASE_BRANCH contains "[missing:":
           - If REPO is Amakaflow/amakaflow-backend → BASE_BRANCH = develop
           - Otherwise → BASE_BRANCH = main

      ⚠️ FALLBACK: If BRANCH or REPO contain "[missing:" values, discover them:
        1. Determine the actual repo: use REPO value. If it contains "[missing:", use REPO_FALLBACK.
        2. Discover the branch:
           git ls-remote --heads https://github.com/<repo>.git "refs/heads/feature/{{ticket_id}}*"

      Task:
      1. Check out the branch (use discovered repo and branch if needed):
         cd /tmp/{{ticket_id}}-work && git checkout <branch> && git pull origin <branch>
         OR if directory doesn't exist:
         git clone https://github.com/<repo>.git /tmp/{{ticket_id}}-work
         cd /tmp/{{ticket_id}}-work && git checkout <branch>

      1b. CHECK FOR EXISTING PR WITH ISSUES (this step may be retried after merge failure):
         - Check if a PR already exists for this branch:
           gh pr list --repo <repo> --head <branch> --state open --json number,url,statusCheckRollup,reviews
         - If a PR exists, ALWAYS check for BOTH CI failures AND CHANGES_REQUESTED reviews:
           a. Get full details:
              gh pr view <pr_number> --repo <repo> --json reviews,statusCheckRollup \
                --jq '{blocking_reviews: [.reviews[] | select(.state == "CHANGES_REQUESTED") | {author: .author.login, body: .body}], failed_checks: [.statusCheckRollup[] | select(.conclusion == "FAILURE") | .name]}'
           b. Read all inline PR review comments:
              gh api repos/<repo>/pulls/<pr_number>/comments --jq '[.[] | {body: .body, path: .path, line: .original_line}]'
           c. If CHANGES_REQUESTED reviews exist OR CI failures exist:
              - Read EVERY review body and inline comment carefully
              - Fix ALL issues mentioned (review feedback AND CI failures)
              - Run tests locally to verify fixes: pytest tests/ -v --tb=short
              - Commit: git commit -am "fix: address code review feedback for {{ticket_id}}"
              - Push: git push origin <branch>
           d. Skip to step 5 (PR already exists, just report its number/URL)

      2. If AUDIT_RESULT is "pass":
         - No code fixes needed, skip to step 4
      3. If AUDIT_RESULT is "fail":
         - Read the ISSUES and RECOMMENDATIONS carefully
         - Fix each issue in the code
         - Run tests to make sure fixes don't break anything
         - Commit fixes: git commit -am "fix: address audit feedback for {{ticket_id}}"
         - Push: git push origin <branch>

      3b. REBASE CHECK — before creating the PR, ensure the branch is up to date with BASE_BRANCH:
         a. Check how far behind BASE_BRANCH the branch is:
            gh api repos/<repo>/compare/<BASE_BRANCH>...<branch> --jq .behind_by
         b. If behind_by > 0:
            git fetch origin <BASE_BRANCH>
            git rebase origin/<BASE_BRANCH>
            - If rebase succeeds: git push --force-with-lease origin <branch>
            - If rebase fails (conflicts):
              git rebase --abort
              Reply STATUS: escalate with REASON: rebase conflict — manual resolution required, list the conflicted files
         c. If behind_by == 0: continue to step 4

      4. Create a Pull Request to BASE_BRANCH:
         gh pr create --repo <repo> --base <BASE_BRANCH> --head <branch> \
           --title "{{ticket_id}}: {{title}}" \
           --body "Implements {{ticket_id}} — {{title}}"

      5. Capture the PR number and URL from the gh pr create output.

      6. Set ticket to "In Review" in Linear (ISSUE_ID is in the input above):
         mutation {
           issueUpdate(id: "{{issue_id}}", input: { stateId: "e476bee3-6f64-4c25-88e2-664fccf7b644" }) { success }
         }
         If ISSUE_ID contains "[missing:", query for it: { issue(id: "{{ticket_id}}") { id } }

      ═══════════════════════════════════════════════════════════════════════

      🚨 REMINDER: MANDATORY OUTPUT FORMAT 🚨

      STATUS: done
      PR_NUMBER: #<number>
      PR_URL: https://github.com/<repo>/pull/<number>

      - STATUS must be "done"
      - PR_NUMBER must start with # followed by the number
      - PR_URL must be the complete GitHub pull request URL

      DO NOT use any other key names. DO NOT omit any keys.
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: merge
    agent: closer
    input: |
      Merge PR {{pr_number}} for {{ticket_id}}, verify, and clean up.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: {{repo_name}}
      REPO_FALLBACK: {{repo}}
      BASE_BRANCH: {{base_branch}}
      TICKET: {{ticket_id}}

      ⚠️ Use BASE_BRANCH (not "main") everywhere below.
         If BASE_BRANCH contains "[missing:":
           - If REPO is Amakaflow/amakaflow-backend → BASE_BRANCH = develop
           - Otherwise → BASE_BRANCH = main

      ⚠️ CRITICAL: Do NOT use sleep, wait, or polling loops. Check ONCE and return immediately.
      🚨 ABSOLUTE RULE: Do NOT fabricate, guess, or invent a merge SHA. You MUST get it from the GitHub API.

      ⚠️ FALLBACK: If PR or URL contain "[missing:" values, discover the PR:
        1. Determine the actual repo: use REPO value. If it contains "[missing:", use REPO_FALLBACK.
        2. Find the open PR for this ticket:
           gh pr list --repo <repo> --state open --json number,url,headRefName \
             --jq '.[] | select(.headRefName | contains("{{ticket_id}}"))'
        3. If NO open PR is found, check for a closed PR with real work on the branch:
           a. Find the closed PR:
              gh pr list --repo <repo> --state closed --json number,url,headRefName \
                --jq '.[] | select(.headRefName | contains("{{ticket_id}}"))'
           b. If a closed PR exists, check if the branch still has commits above BASE_BRANCH:
              gh api repos/<repo>/compare/<BASE_BRANCH>...<branch-name> --jq .ahead_by
           c. If ahead_by > 0, the branch has real work — reopen the PR:
              gh pr reopen <pr_number> --repo <repo>
              Then use this PR for all subsequent steps.
           d. If ahead_by == 0, the branch is empty — reply STATUS: escalate with REASON: branch has no commits above BASE_BRANCH.
        4. Use the discovered (or reopened) PR number and URL for all subsequent commands.

      Task:
      1. Check that CI checks have passed (ONE check, no polling):
         gh pr checks <pr_number> --repo <repo>
         If checks are still running, wait up to 60 seconds checking every 10 seconds.
         If checks fail, reply STATUS: escalate with details.

      1b. CHECK FOR BLOCKING REVIEWS before attempting merge:
         gh pr view <pr_number> --repo <repo> --json reviews,mergeStateStatus \
           --jq '{status: .mergeStateStatus, blocking: [.reviews[] | select(.state == "CHANGES_REQUESTED") | {author: .author.login, body: .body}]}'
         If CHANGES_REQUESTED reviews are present:
           - Collect the full review feedback text from each blocking review
           - Post a comment on the PR to notify Joshua:
             gh pr comment <pr_number> --repo <repo> --body "⚠️ **Automated merge blocked — action required**\n\nThis PR cannot be merged because a code review has requested changes.\n\n**Review feedback:**\n$(review body text here)\n\n**Joshua**: Please review the feedback above. If the automated fix attempts are exhausted, manual intervention is needed. Re-push the branch after fixing to re-trigger the pipeline."
           - Then reply immediately:
             STATUS: escalate
             REASON: CHANGES_REQUESTED — code review feedback must be addressed before merging
             REVIEW_FEEDBACK: <concatenated text of all review bodies>
             PR_NUMBER: <pr_number>
             PR_URL: <pr_url>

      2. Check if the PR is mergeable:
         gh pr view <pr_number> --repo <repo> --json mergeable,mergeStateStatus

      3. If mergeable: merge with squash:
         gh pr merge <pr_number> --repo <repo> --squash --delete-branch
         IMPORTANT: Check the exit code. If the command fails, do NOT proceed — report STATUS: escalate.

      4. If NOT mergeable (conflicts with BASE_BRANCH): attempt rebase:
         a. cd /tmp/{{ticket_id}}-work || git clone https://github.com/<repo>.git /tmp/{{ticket_id}}-work
         b. cd /tmp/{{ticket_id}}-work && git checkout <branch> && git fetch origin <BASE_BRANCH>
         c. git rebase origin/<BASE_BRANCH>
         d. If rebase succeeds: git push --force-with-lease, then try merge again
         e. If rebase fails: git rebase --abort, then reply STATUS: escalate

      5. MANDATORY VERIFICATION — Do NOT skip this step:
         gh pr view <pr_number> --repo <repo> --json state,mergeCommit --jq '{state: .state, sha: .mergeCommit.oid}'
         - If state is "MERGED": extract the sha. This is your MERGE_SHA.
         - If state is NOT "MERGED": reply STATUS: escalate.
         - If sha is null or empty: reply STATUS: escalate.

      If merge fails at any point:
      STATUS: escalate
      REASON: <why it failed — include exact error output>

      If merge succeeded AND state=MERGED AND you have a real SHA:
      STATUS: done
      MERGE_SHA: <the exact sha from gh pr view — NOT invented>
      TICKET: {{ticket_id}}
      MERGED: true
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      retry_step: fix_and_pr
      max_retries: 2
      escalate_to: human

  - id: post_merge
    agent: closer
    input: |
      Verify merge and clean up for {{ticket_id}}.

      TICKET: {{ticket_id}}
      ISSUE_ID: {{issue_id}}
      REPO: {{repo_name}}
      REPO_FALLBACK: {{repo}}
      BASE_BRANCH: {{base_branch}}
      MERGE_SHA: {{merge_sha}}

      ⚠️ CRITICAL: Do NOT use sleep, wait, or polling loops. Check ONCE and return immediately.

      ⚠️ FALLBACK: If REPO contains "[missing:", use REPO_FALLBACK. If BASE_BRANCH contains "[missing:", detect it: gh repo view <repo> --json defaultBranchRef --jq .defaultBranchRef.name

      Task:
      0. MANDATORY FIRST CHECK — verify the PR is actually merged (prevent false positives):
         gh pr view <pr_number_or_discover_it> --repo <repo> --json state,mergeCommit \
           --jq '{state: .state, sha: .mergeCommit.oid}'
         ⚠️ FALLBACK: If PR number is unknown, discover it:
           gh pr list --repo <repo> --state all --search "{{ticket_id}}" --json number,state,mergeCommit \
             --jq '.[] | {number, state, sha: .mergeCommit.oid}'
         - If state is NOT "MERGED": reply STATUS: escalate with REASON: PR is still open — merge did not complete
         - If state is "MERGED" but sha is null/empty: reply STATUS: escalate with REASON: PR merged but no commit SHA found
         - Only proceed if state == "MERGED" AND sha is present

      1. Verify the merge commit exists on BASE_BRANCH:
         gh api repos/<repo>/commits/{{merge_sha}} --jq '.sha' 2>/dev/null
         If MERGE_SHA contains "[missing:", use the sha discovered in step 0 above.

      2. Clean up work directories:
         rm -rf /tmp/{{ticket_id}}-work /tmp/{{ticket_id}}-audit 2>/dev/null || true

      3. Set ticket to "Done" in Linear (ISSUE_ID is in the input above):
         mutation {
           issueUpdate(id: "{{issue_id}}", input: { stateId: "06db5600-ff0f-47d8-92b8-d742ab151def" }) { success }
         }
         If ISSUE_ID contains "[missing:", query for it: { issue(id: "{{ticket_id}}") { id } }

      4. Report results:

      If verification succeeded:
      STATUS: done
      VERIFIED: true
      CLEANUP: done

      If verification failed:
      STATUS: escalate
      REASON: <why verification failed>
    expects: "STATUS: done"
    on_fail:
      escalate_to: human

steps_flow:
  - pick_ticket
  - develop
  - run_tests
  - audit
  - fix_and_pr
  - merge
  - post_merge
