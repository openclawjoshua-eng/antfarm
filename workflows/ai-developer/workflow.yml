id: ai-developer
name: AI Developer Workflow
version: 2
description: |
  General-purpose AI developer pipeline.
  - Ticket Picker: Picks next Linear ticket from project backlog
  - Developer: Implements code with MiniMax-M2.5
  - Auditor: Pre-reviews with DeepSeek (security + best practices)
  - Closer: Monitors PR status, handles post-merge cleanup

context:
  repo: supergeri/mapper-api
  linear_project: AMA
  linear_team: AmakaFlow

polling:
  model: anthropic/claude-haiku-4-5-20251001
  timeoutSeconds: 300

agents:
  - id: ticket_picker
    name: Ticket Picker
    role: analysis
    model: anthropic/claude-haiku-4-5-20251001
    description: Picks next ready Linear ticket from project backlog
    workspace:
      baseDir: agents/ticket_picker
      files:
        AGENTS.md: agents/ticket_picker/AGENTS.md

  - id: developer
    name: Developer
    role: coding
    model: minimax/MiniMax-M2.5
    description: Implements ticket code with MiniMax-M2.5
    workspace:
      baseDir: agents/developer
      files:
        AGENTS.md: agents/developer/AGENTS.md

  - id: auditor
    name: Auditor (DeepSeek)
    role: analysis
    model: deepseek/deepseek-chat
    description: Pre-reviews code for security + performance before PR
    workspace:
      baseDir: agents/auditor
      files:
        AGENTS.md: agents/auditor/AGENTS.md

  - id: closer
    name: Closer
    role: analysis
    model: anthropic/claude-haiku-4-5-20251001
    description: Monitors PR status, handles post-merge cleanup
    workspace:
      baseDir: agents/closer
      files:
        AGENTS.md: agents/closer/AGENTS.md

steps:
  - id: pick_ticket
    agent: ticket_picker
    input: |
      TASK: "{{task}}"

      ⚠️ CRITICAL RULE — READ THIS FIRST:
      Extract any ticket ID (like AMA-607, AMA-123, etc.) from the TASK above.
      If a ticket ID is present, you MUST look up THAT EXACT ticket in Linear
      and return its details. Do NOT search the backlog. Do NOT pick a different
      ticket. Just fetch the one specified and return it.

      ONLY if the TASK contains NO ticket ID, then pick from the backlog:
      1. Query Linear for issues in the {{linear_team}} team where:
         - Status is "Todo", "In Progress", or "Ready"
         - Not blocked by unfinished dependencies
      2. SKIP these ticket types (they are not coding tasks):
         - Tickets with "SPIKE" in the title (research/planning tasks)
         - Tickets with "SPIKE" label
         - Tickets that are purely documentation or research with no code changes
      3. Sort by priority (Urgent > High > Medium > Low > No priority)
      4. Pick the highest-priority unblocked CODING ticket
      5. Get full ticket details: title, description, acceptance criteria
      6. If no tickets are ready, reply with STATUS: no_work

      Reply with EXACTLY this format:
      STATUS: done
      TICKET_ID: <the ticket ID, e.g. AMA-607>
      TITLE: <ticket title>
      DESCRIPTION: <full description from Linear>
      ACCEPTANCE_CRITERIA: |
        - Criterion 1
        - Criterion 2
    expects: "STATUS: done"
    max_retries: 1
    on_fail:
      escalate_to: human

  - id: develop
    agent: developer
    timeoutSeconds: 600
    input: |
      🚨 CRITICAL: OUTPUT FORMAT REQUIREMENTS (READ THIS FIRST) 🚨

      FAILURE TO USE EXACT KEY NAMES WILL BREAK THE PIPELINE AND CAUSE SYSTEM FAILURE.

      You MUST respond with EXACTLY these four keys — NO substitutions, NO variations:

      STATUS: done
      CHANGED_FILES: file1.py, file2.py
      PR_NUMBER: #142
      PR_URL: https://github.com/supergeri/mapper-api/pull/142

      ❌ WRONG key names that will BREAK the system:
      - CHANGES: (wrong — must be CHANGED_FILES)
      - FILES: (wrong — must be CHANGED_FILES)
      - TESTS: (wrong — not a valid key)
      - PR: (wrong — must be PR_NUMBER and PR_URL)
      - PULL_REQUEST: (wrong — must be PR_NUMBER and PR_URL)

      ✅ CORRECT example output:
      STATUS: done
      CHANGED_FILES: src/api/routes.py, src/models/user.py, tests/test_routes.py
      PR_NUMBER: #142
      PR_URL: https://github.com/supergeri/mapper-api/pull/142

      ALL FOUR KEYS ARE MANDATORY. Missing any key will cause pipeline failure.

      ═══════════════════════════════════════════════════════════════════════

      Implement {{ticket_id}} ({{title}}) in the {{repo}} repository.

      TICKET: {{ticket_id}}
      TITLE: {{title}}
      DESCRIPTION: {{description}}
      ACCEPTANCE_CRITERIA:
      {{acceptance_criteria}}

      Instructions:
      1. Clone the repo fresh or ensure it's up to date:
         git clone https://github.com/{{repo}}.git /tmp/{{ticket_id}}-work || true
         cd /tmp/{{ticket_id}}-work && git checkout main && git pull origin main
      2. Create feature branch FROM latest main:
         git checkout -b feature/{{ticket_id}}-short-name
      3. Read existing code to understand patterns and style
      4. Implement the changes per the acceptance criteria
      5. Run any available tests to verify
      6. Commit with a clear message referencing {{ticket_id}}
      7. Push the branch
      8. Create PR to main with {{ticket_id}} in the title

      ═══════════════════════════════════════════════════════════════════════

      🚨 REMINDER: MANDATORY OUTPUT FORMAT (USE EXACT KEY NAMES) 🚨

      Your response MUST contain EXACTLY these four keys:

      STATUS: done
      CHANGED_FILES: file1.py, file2.py, file3.py
      PR_NUMBER: #142
      PR_URL: https://github.com/supergeri/mapper-api/pull/142

      - STATUS must be "done"
      - CHANGED_FILES must list all modified files (comma-separated)
      - PR_NUMBER must start with # followed by the number
      - PR_URL must be the complete GitHub pull request URL

      DO NOT use any other key names. DO NOT add extra keys. DO NOT omit any keys.
      Using wrong key names (like CHANGES, FILES, TESTS, PR, etc.) will break the pipeline.
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: run_tests
    agent: developer
    timeoutSeconds: 600
    input: |
      Run the test suite for {{ticket_id}} to verify the implementation works.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: {{repo}}
      TICKET: {{ticket_id}}
      CHANGED_FILES: {{changed_files}}

      Task:
      1. Check out the PR branch:
         cd /tmp/{{ticket_id}}-work && git pull origin
         OR if directory doesn't exist:
         gh pr checkout {{pr_number}} --repo {{repo}}

      2. Set up the Python test environment:
         python3 -m venv .venv
         source .venv/bin/activate
         pip install -r requirements-dev.txt 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      3. Run unit and integration tests:
         pytest tests/ -m "unit or integration" -v --tb=short 2>&1

         If no pytest markers exist, run:
         pytest tests/ -v --tb=short 2>&1

      4. Analyze the results:
         - If ALL tests pass: report STATUS: done
         - If tests FAIL: report STATUS: tests_failed with full failure output

      If tests pass, reply:
      STATUS: done
      TESTS_PASSED: <number of tests passed>
      TEST_OUTPUT: <summary of test results>

      If tests fail, reply:
      STATUS: tests_failed
      TESTS_FAILED: <number of tests failed>
      FAILURE_OUTPUT: |
        <full pytest output showing failures — include tracebacks>
      SUGGESTED_FIXES: |
        <what you think needs to change based on the failures>
    expects: "STATUS: done"
    max_retries: 1
    on_fail:
      retry_step: develop
      max_retries: 2
      on_exhausted:
        escalate_to: human

  - id: audit
    agent: auditor
    input: |
      Pre-review the changes for {{ticket_id}} before merging.

      CHANGED_FILES: {{changed_files}}
      TICKET: {{ticket_id}}
      PR: {{pr_url}}

      Task:
      1. Read the changed files in the PR
      2. Check for:
         - Security issues (injection, auth bypass, credential leaks)
         - Missing input validation
         - Error handling (specific exceptions, not bare catch-all)
         - Type safety
         - Performance concerns (N+1, blocking calls, etc.)
         - Code style consistency with the rest of the codebase
      3. Generate audit report with specific file paths and line numbers
      4. If issues found, output them for developer to fix

      Reply with:
      STATUS: done
      AUDIT_RESULT: pass|fail
      ISSUES: (if any)
        - Issue 1 (file:line)
        - Issue 2 (file:line)
      RECOMMENDATIONS:
        - Fix 1
        - Fix 2

      Or if critical issues:
      STATUS: escalate
      CRITICAL_ISSUES:
        - Blocker 1
        - Blocker 2
    expects: "STATUS: done"
    on_fail:
      retry_step: develop
      max_retries: 1

  - id: fix_review
    agent: developer
    timeoutSeconds: 600
    input: |
      Check PR {{pr_number}} for code review feedback and fix any requested changes.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: {{repo}}
      TICKET: {{ticket_id}}

      Task:
      1. Run: gh pr reviews {{pr_number}} --repo {{repo}} --json state,body
      2. Run: gh pr view {{pr_number}} --repo {{repo}} --json reviews,comments
      3. If the review state is "APPROVED" or no reviews exist yet, reply:
         STATUS: done
         REVIEW_STATE: approved
         (This is a pass-through — no fixes needed)
      4. If the review state is "CHANGES_REQUESTED":
         a. Read ALL review comments carefully
         b. Check out the PR branch: gh pr checkout {{pr_number}} --repo {{repo}}
         c. Make the requested fixes in the code
         d. Run any available tests to verify
         e. Commit with message: "fix: address code review feedback for {{ticket_id}}"
         f. Push the changes
         g. Reply with:
            STATUS: done
            REVIEW_STATE: fixed
            FIXES: summary of what you fixed

      Reply with:
      STATUS: done
      REVIEW_STATE: approved|fixed
    expects: "STATUS: done"
    max_retries: 1
    on_fail:
      escalate_to: human

  - id: wait_review
    agent: closer
    input: |
      Check PR {{pr_number}} for Claude code review approval.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: {{repo}}

      Task:
      1. Run: gh pr checks {{pr_number}} --repo {{repo}}
         Wait until CI checks are complete (poll every 30s, up to 5 min)
      2. Run: gh pr reviews {{pr_number}} --repo {{repo}} --json state,body
      3. If review state is "APPROVED": reply STATUS: approved
      4. If review state is "CHANGES_REQUESTED": reply STATUS: changes_requested
         Include REVIEW_FEEDBACK with the review comments so the developer knows what to fix
      5. If no review yet: poll every 30s for up to 5 minutes, then reply STATUS: changes_requested

      If approved, reply:
      STATUS: approved

      If changes requested, reply:
      STATUS: changes_requested
      REVIEW_FEEDBACK: <the review comments>
    expects: "STATUS: approved"
    max_retries: 3
    on_fail:
      retry_step: fix_review
      max_retries: 3
      on_exhausted:
        escalate_to: human

  - id: merge_pr
    agent: closer
    input: |
      Merge PR #{{pr_number}} for {{ticket_id}} into main.

      PR: {{pr_number}}
      URL: {{pr_url}}
      REPO: {{repo}}
      TICKET: {{ticket_id}}

      Task:
      1. Check that CI checks have passed:
         gh pr checks {{pr_number}} --repo {{repo}}
         If checks are still running, wait up to 5 minutes (poll every 30s).

      2. Check if the PR is mergeable:
         gh pr view {{pr_number}} --repo {{repo}} --json mergeable,mergeStateStatus

      3. If mergeable: merge with squash:
         gh pr merge {{pr_number}} --repo {{repo}} --squash --delete-branch

      4. If NOT mergeable (conflicts with main): attempt rebase:
         a. gh pr checkout {{pr_number}} --repo {{repo}}
         b. git fetch origin main
         c. git rebase origin/main
         d. If rebase succeeds (no conflicts): git push --force-with-lease
         e. Wait for CI to re-run, then try merge again
         f. If rebase fails (conflicts): git rebase --abort, then reply STATUS: escalate

      5. Verify the merge succeeded

      If the merge fails after rebase attempt, reply with:
      STATUS: escalate
      REASON: why the merge failed (include conflict details)

      Reply with:
      STATUS: done
      MERGE_SHA: the merge commit SHA
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: post_merge
    agent: closer
    input: |
      {{ticket_id}} PR #{{pr_number}} has been merged. Mark ticket complete.

      TICKET: {{ticket_id}}
      PR: {{pr_number}}

      Task:
      1. In Linear, move {{ticket_id}} to "Done"
      2. Log completion in MEMORY.md
      3. Next iteration will pick up the next ticket

      Reply with:
      STATUS: done
      TICKET: {{ticket_id}}
      NEXT: auto-pick next ticket
    expects: "STATUS: done"
    on_fail:
      escalate_to: human

steps_flow:
  - pick_ticket
  - develop
  - run_tests
  - audit
  - fix_review
  - wait_review
  - merge_pr
  - post_merge
